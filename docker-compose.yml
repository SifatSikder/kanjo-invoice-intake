# Single command to run everything: `docker compose up --build`
#
# Four services come up together:
#   db          PostgreSQL, holding the audit trail and the review queue
#   accounting  the client's accounting system, run VERBATIM from accounting_api.py
#   api         the intake pipeline (FastAPI)
#   web         the human review screen (Next.js)
#
# The accounting API is containerised, not modified: the same file the brief
# supplies is copied in and run with `python3 accounting_api.py`, exactly as
# documented. Its behaviour, error codes and port are untouched.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      # 5433 on the host: many machines already run a native Postgres on 5432.
      # Inside the compose network the api service still reaches it as db:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 3s
      timeout: 3s
      retries: 20

  accounting:
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - ./accounting_api.py:/srv/accounting_api.py:ro
    command: ["python3", "accounting_api.py"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://invoice:invoice@db:5432/invoice
      ACCOUNTING_API_BASE: http://accounting:8080
      ACCOUNTING_API_KEY: demo-key-1234
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-google/gemini-3.7-flash}
      AUTO_POST_ENABLED: ${AUTO_POST_ENABLED:-true}
      AMOUNT_REVIEW_THRESHOLD_JPY: ${AMOUNT_REVIEW_THRESHOLD_JPY:-1000000}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      # 8001 on the host: 8000 is a common default and is often already taken.
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      accounting:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      # Browser-side calls go to the host-published port; server-side to the network alias.
      NEXT_PUBLIC_API_BASE: http://localhost:8001
      API_BASE: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
