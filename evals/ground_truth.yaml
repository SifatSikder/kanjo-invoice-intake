invoice_09.pdf:
  supplier_name: 大阪機械工業株式会社
  registration_no: T4040004000404
  expected_partner_code: P-1004
  invoice_number: OSK-26-0128
  issue_date: '2026-01-28'
  due_date: '2026-02-20'
  subtotal: 134088
  tax_amount: 13408
  total_amount: 147497
  lines:
  - description: シャフト加工
    quantity: 37
    unit: 個
    unit_price: 2733
    amount: 101121
    tax_code: T10
  - description: 熱処理
    quantity: 37
    unit: 個
    unit_price: 891
    amount: 32967
    tax_code: T10
  traps:
  - PDF with NO text layer (scanned image only)
  - floor rounding 13,408.8 -> 13,408
  - 'DOCUMENT DEFECT: printed 合計 147,497 but 134,088 + 13,408 = 147,496'
  expected_disposition: NEEDS_REVIEW
  disposition_reason: 'the supplier''s own totals do not reconcile: printed total is 1 JPY above lines
    + floored tax. Posting it as printed returns AMOUNT_MISMATCH.'
  document_defect:
    kind: TOTAL_ROUNDING
    printed_total: 147497
    recalculated_total: 147496
    difference: 1
    explanation: supplier floored the tax on the tax line but rounded it up when computing the total
  postable_total: 147496
