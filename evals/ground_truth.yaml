# Hand-built ground truth for the 12 sample invoices.
# Transcribed by reading each document directly, then cross-checked against the
# accounting API's own arithmetic (sum of lines; floor(subtotal x rate) per tax code).
#
# Note invoice_09: its printed total does not reconcile with its own line items.
# That is a defect in the supplier's document, not a transcription error, and the
# pipeline is expected to catch it rather than post it.

